name: build-kit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the kit through a host's @tungsten alias
        working-directory: tests/js-host
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Render kit pages on the server (SSR safety)
        working-directory: tests/js-host
        run: npm run ssr
